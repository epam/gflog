plugins {
    id "com.gradleup.shadow" version "9.6.1" apply false
}

def isReleaseVersion = !version.endsWith('-SNAPSHOT')
def sonatypeCentralPortalReleasesRepoUrl = System.getenv('MAVEN_REPOSITORY')
def sonatypeCentralPortalUsername = System.getenv('MAVEN_USERNAME')
def sonatypeCentralPortalPassword = System.getenv('MAVEN_PASSWORD')

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'checkstyle'

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation 'junit:junit:4.12'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // JDK 21 hides sun.misc.Unsafe when --release 8 is set. JDK 8 javac still sees it and emits Java 8 bytecode.
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }

    test {
        testLogging {
            events "passed", "skipped", "failed", "standardOut", "standardError"
            exceptionFormat = "full"
        }

        maxParallelForks = Runtime.runtime.availableProcessors().intdiv(4) ?: 1
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withJavadocJar()
        withSourcesJar()
    }

    publishing {
        repositories {
            maven {
                url = sonatypeCentralPortalReleasesRepoUrl

                credentials {
                    username = sonatypeCentralPortalUsername
                    password = sonatypeCentralPortalPassword
                }
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = 'gflog'
                    packaging = 'jar'
                    description = 'Highly efficient garbage-free logging framework for Java 8+'
                    url = 'https://github.com/epam/GFLog'

                    scm {
                        connection = 'scm:git:https://github.com/epam/GFLog.git'
                        developerConnection = 'scm:git:https://github.com/epam/GFLog.git'
                        url = 'https://github.com/epam/GFLog.git'
                    }

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'artsiomkorzun'
                            name = 'Artsiom Korzun'
                            email = 'humanfault101@gmail.com'
                            url = 'https://github.com/artsiomkorzun'
                            organization = 'EPAM Systems'
                            organizationUrl = 'https://www.epam.com/'
                        }
                    }
                }
            }
        }

    }

    signing {
        def signingKey = System.getenv("SIGNING_KEY")
        def signingPassword = System.getenv("SIGNING_PASSWORD")
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.mavenJava
        required = isReleaseVersion
    }
}

project('gflog-api') {
    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
    }
}

project('gflog-core') {
    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
        api project(':gflog-api')

        testImplementation 'org.mockito:mockito-core:3.5.11'
    }
}

project('gflog-mail') {
    dependencies {
        api project(':gflog-core')
        api 'javax.mail:mail:1.4.7'
    }
}

project('gflog-jcl') {
    dependencies {
        api project(':gflog-api')
        api 'commons-logging:commons-logging:1.2'
    }
}

project('gflog-jul') {
    dependencies {
        api project(':gflog-api')
        testImplementation project(':gflog-core')
    }
}

project('gflog-slf4j') {
    dependencies {
        api project(':gflog-api')
        api 'org.slf4j:slf4j-api:2.0.11'
        testImplementation project(':gflog-core')
    }
}

project('gflog-benchmark') {
    apply plugin: 'com.gradleup.shadow'

    shadowJar.manifest.attributes << ['Main-Class': 'org.openjdk.jmh.Main']

    dependencies {
        annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.34'
        implementation 'org.openjdk.jmh:jmh-core:1.34'
        implementation 'org.openjdk.jol:jol-core:0.16'
        implementation 'org.hdrhistogram:HdrHistogram:2.1.12'
        implementation 'net.openhft:affinity:3.21ea83'
        implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
        implementation 'com.lmax:disruptor:3.4.4'
        implementation project(':gflog-core')
    }
}

project('gflog-sample') {
    dependencies {
        implementation project(':gflog-core')
    }
}

def publishingProjects = subprojects - project('gflog-benchmark') - project('gflog-sample')
tasks.register('publishAll') {
    dependsOn publishingProjects.collect { it.path + ":publish" }
    group = 'publishing'
    description = 'Publish All Artifacts'
}

tasks.register('uploadArtifactsToCentralPortal', com.epam.deltix.buildsrc.SonatypeCentralPortalUploadRepositoryTask) {
    portalUsername.set(sonatypeCentralPortalUsername)
    portalPassword.set(sonatypeCentralPortalPassword)
    groupId.set('com.epam.deltix')
    snapshotRelease.set(!isReleaseVersion)
}

wrapper {
    gradleVersion = '9.9.3'
    distributionType = Wrapper.DistributionType.BIN
}